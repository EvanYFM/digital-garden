<style>
/* ---------- 布局：左目录 / 右正文 ---------- */
.layout{
  max-width:1180px;margin:0 auto;padding:0 48px;
  display:grid;grid-template-columns:200px minmax(0,1fr);gap:96px;
}

/* ---------- 左侧 sticky 目录 ---------- */
.toc{position:relative;padding-top:280px}
.toc-inner{position:sticky;top:160px}
.toc a{
  display:flex;align-items:baseline;gap:12px;
  padding:11px 0 11px 20px;position:relative;
  text-decoration:none;color:var(--gray);
  font-size:12.5px;letter-spacing:.1em;line-height:1.7;
  transition:color .5s var(--ease);
}
.toc a .no{font-family:var(--serif);font-size:12.5px;flex:none}
/* 目录左侧：一条静止的细线 + 一粒随阅读位置游走的墨点 */
.toc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--line)}
.toc a::before{
  content:"";position:absolute;left:-2.5px;top:50%;width:6px;height:6px;border-radius:50%;
  background:var(--ink);transform:translateY(-50%) scale(0);
  transition:transform .45s var(--ease);
}
.toc a.on{color:var(--ink)}
.toc a.on::before{transform:translateY(-50%) scale(1)}
.toc a:hover{color:var(--ink)}
.toc-back{
  display:inline-flex;align-items:center;gap:12px;margin-top:56px;
  font-size:11px;letter-spacing:.24em;color:var(--gray);text-decoration:none;
  transition:color .4s;
}
.toc-back:hover{color:var(--ink)}
.toc-back .sq{width:7px;height:7px;border:1px solid currentColor;border-radius:50%}

/* ---------- 目录收起 / 展开开关（位于目录文字上方） ---------- */
.toc-fold{
  display:inline-flex;align-items:center;gap:10px;margin-bottom:26px;
  font-size:11px;letter-spacing:.24em;color:var(--gray);text-decoration:none;
  background:none;border:none;cursor:pointer;font-family:var(--sans);
  /* 与 .toc a / .toc-back 同距：圆点与「返回思考」圆点同一条竖线 */
  padding:0 0 0 20px;
  transition:color .4s;
}
.toc-fold:hover{color:var(--ink)}
.toc-fold .sq{width:7px;height:7px;border:1px solid currentColor;border-radius:50%;flex:none;
  transition:transform .45s var(--ease)}
.toc-fold:hover .sq{transform:scale(.75)}

/* 目录收起态：目录列塌缩为 0，正文与上下篇整体居中；恢复入口 fixed 于左上 */
.layout.no-toc{grid-template-columns:0 minmax(0,1fr);gap:0}
.layout.no-toc .toc{padding-top:0;overflow:visible}
.layout.no-toc .toc::before{display:none}
.layout.no-toc .toc-inner{display:none}
.layout.no-toc .article,.layout.no-toc .pn{margin-left:auto;margin-right:auto}
.toc-restore{
  position:fixed;left:22px;top:88px;z-index:60;
  display:none;align-items:center;gap:10px;
  font-size:11px;letter-spacing:.24em;color:var(--gray);text-decoration:none;
  background:var(--paper);border:1px solid var(--line);padding:10px 14px;
  transition:color .4s,border-color .4s;
}
.layout.no-toc ~ .toc-restore{display:inline-flex}
.toc-restore:hover{color:var(--ink);border-color:var(--ink)}
.toc-restore .sq{width:7px;height:7px;border:1px solid currentColor;border-radius:50%}
@media (max-width:960px){.toc-restore{display:none!important}}

/* ---------- 页宽两档：适中（默认 660）/ 铺满（1080，行字更多） ---------- */
html.rw-wide .article{max-width:1080px}
html.rw-wide .pn{max-width:1080px}
html.rw-wide .layout{max-width:1600px}
html.rw-wide .article p{font-size:15.5px}

/* ---------- 沉浸阅读：全屏 + 隐去目录 / 顶栏 / 页脚 / 上下篇 ---------- */
html.imm header{display:none}
html.imm footer{display:none}
html.imm .pn{display:none}
html.imm .uacts{display:none}
/* 目录不可整个 display:none——会让正文 div 滑入 0 宽的首列；改为留壳藏内容 */
html.imm .toc{padding-top:0;overflow:visible}
html.imm .toc::before{display:none}
html.imm .toc-inner{display:none}
html.imm .toc-restore{display:none!important}
html.imm .layout{grid-template-columns:0 minmax(0,1fr);gap:0}
html.imm .article,html.imm .pn{margin-left:auto;margin-right:auto}
html.imm .article{padding-top:12vh}
html.imm .endmark{margin-bottom:14vh}
/* 沉浸退出：右下角浮动，悬停显形 */
.imm-exit{
  position:fixed;right:22px;bottom:22px;z-index:70;display:none;
  align-items:center;gap:10px;padding:10px 16px;
  font-size:11px;letter-spacing:.22em;color:var(--gray);
  background:var(--paper);border:1px solid var(--line);cursor:pointer;
  font-family:var(--sans);opacity:.35;transition:opacity .4s,color .4s,border-color .4s;
}
html.imm .imm-exit{display:inline-flex}
.imm-exit:hover{opacity:1;color:var(--ink);border-color:var(--ink)}
.imm-exit .sq{width:7px;height:7px;border:1px solid currentColor;border-radius:50%}
@media print{.imm-exit,.toc-restore{display:none!important}}

/* ---------- 阅读控制：文章框架右上角，随滚动常驻（宽 / 沉，线形符号） ---------- */
.readctl{
  position:sticky;top:96px;z-index:50;height:0;overflow:visible;
  display:flex;justify-content:flex-end;gap:14px;padding-right:4px;
}
html.imm .readctl{top:28px}
.rbtn{
  width:26px;height:26px;padding:0;border:none;background:transparent;cursor:pointer;
  color:var(--gray);opacity:.55;flex:none;
  transition:opacity .4s,color .4s,transform .45s var(--ease);
}
.rbtn:hover{opacity:1;color:var(--ink)}
.rbtn:active{transform:scale(.85)}
.rbtn svg{display:block;width:100%;height:100%;overflow:visible}
.rbtn svg path{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
/* 激活态：朱砂点亮 */
.rbtn.on{color:var(--cinnabar);opacity:.95}
/* 沉浸按钮双态图标：进入后外扩角变内收角 */
#immBtn .i-com{display:none}
html.imm #immBtn .i-exp{display:none}
html.imm #immBtn .i-com{display:block}
@media (max-width:960px){.readctl{display:none}}
@media print{.readctl{display:none!important}}

/* ---------- 正文 ---------- */
.article{padding:min(44vh,440px) 0 40px;max-width:660px;position:relative}
.crumb{font-size:11px;letter-spacing:.3em;color:var(--gray);margin-bottom:44px;
  text-transform:uppercase}
.crumb b{font-weight:400;color:var(--cinnabar)}
.article h1{
  font-family:var(--serif);font-size:clamp(28px,3.6vw,40px);font-weight:600;
  letter-spacing:.05em;line-height:1.6;margin-bottom:30px;
}
.art-meta{
  display:flex;flex-wrap:wrap;gap:0;font-size:12px;color:var(--charcoal);
  letter-spacing:.16em;padding:20px 0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin-bottom:72px;
}
.art-meta span+i, .art-meta i{font-style:normal;color:var(--cinnabar);margin:0 12px}
@media(max-width:760px){
  .art-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .art-meta i{display:none}
}
.article h2{
  font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.1em;
  margin:88px 0 32px;display:flex;align-items:baseline;gap:18px;
  scroll-margin-top:120px;
}
.article h2 .no{font-size:23px;color:var(--cinnabar);font-weight:600}
.article p{
  font-size:15px;line-height:2.3;color:var(--charcoal);
  margin-bottom:28px;letter-spacing:.04em;text-align:justify;
  overflow-wrap:break-word;
}
.article p b{font-weight:500;color:var(--ink)}
/* 引文块：竖线 + 衬线大字 */
.pull{
  margin:56px 0;padding:8px 0 8px 36px;border-left:1px solid var(--ink);
  font-family:var(--serif);font-size:19px;line-height:2.2;letter-spacing:.08em;
  color:var(--ink);
}
.pull small{display:block;margin-top:16px;font-family:var(--sans);font-size:11px;
  color:var(--gray);letter-spacing:.2em}
/* 边注：正文中的朱砂空心圆环标记，点击/悬停展开——桌面滑入右侧留白，移动端在下方展开 */
.sidenote{margin:38px 0;position:relative}
.sidenote .sn-dot{display:block;width:9px;height:9px;padding:0;
  border:1px solid var(--cinnabar);border-radius:50%;background:transparent;cursor:pointer;
  transition:background .6s var(--ease)}
.sidenote .sn-dot:hover{background:var(--cinnabar)}
.sidenote .sn-body{display:none;margin-top:18px;padding:22px 26px;background:var(--paper-soft);
  font-size:12.5px;line-height:2.1;color:var(--gray);letter-spacing:.05em}
.sidenote .sn-body b{display:block;font-weight:500;color:var(--charcoal);font-size:11px;
  letter-spacing:.3em;margin-bottom:10px}
.sidenote.open .sn-body{display:block;animation:snIn .7s var(--ease)}
@keyframes snIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (min-width:1200px){
  .sidenote{min-height:9px}
  .sidenote .sn-body{display:block;position:absolute;left:calc(100% + 34px);top:-14px;
    width:230px;margin-top:0;opacity:0;transform:translateX(14px);pointer-events:none;
    transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .sidenote.open .sn-body,.sidenote:hover .sn-body{opacity:1;transform:none;pointer-events:auto;animation:none}
}
/* 篇末印记 */
.endmark{display:flex;align-items:center;gap:18px;margin:96px 0 0}
.endmark .ln{flex:1;height:1px;background:var(--line)}
.endmark .sq{width:9px;height:9px;padding:0;border:1px solid var(--cinnabar);border-radius:50%;
  background:transparent;cursor:pointer;flex:none;
  transition:transform .6s var(--ease),background .6s var(--ease)}
.endmark .sq:hover{background:var(--cinnabar)}
.endmark .sq.closing{transform:scale(.25);background:var(--cinnabar)}

/* ---------- 种子 · 本文由哪些随记长成 ---------- */
.seeds{margin:80px 0 0;padding-top:28px;border-top:1px solid var(--line)}
.seeds .lab{font-size:10px;letter-spacing:.34em;color:var(--gray);text-transform:uppercase;
  margin-bottom:10px}
.seeds .lab b{font-weight:400;color:var(--cinnabar)}
.seed{display:flex;gap:22px;align-items:baseline;padding:14px 0}
.seed .d{font-family:var(--serif);font-size:12px;color:var(--gray);flex:none;width:104px;
  letter-spacing:.08em}
.seed .t{flex:1;font-family:var(--serif);font-size:14px;line-height:2.1;color:var(--charcoal);
  letter-spacing:.04em;text-decoration:none;transition:color .4s}
a.seed .t:hover{color:var(--ink)}

/* ---------- 用户文章 · Markdown 正文 ---------- */
.md-body{margin-top:14px}
.md-body h2,.md-body h3,.md-body h1{font-family:var(--serif);font-weight:600;color:var(--ink);
  scroll-margin-top:120px}
.md-body h1,.md-body h2{font-size:clamp(20px,3vw,26px);letter-spacing:.06em;
  margin:72px 0 8px;padding-top:28px;border-top:1px solid var(--line)}
.md-body h1:first-child,.md-body h2:first-child{margin-top:24px;border-top:none;padding-top:0}
.md-body h3{font-size:18px;letter-spacing:.05em;margin:48px 0 6px}
.md-body p{margin:0 0 18px}
.md-body ul,.md-body ol{margin:0 0 18px;padding-left:26px}
.md-body li{margin-bottom:10px;line-height:2.1}
.md-body blockquote{margin:34px 0;padding:2px 0 2px 22px;border-left:2px solid var(--cinnabar);
  font-family:var(--serif);font-size:16px;line-height:2.2;color:var(--charcoal)}
.md-body code{font-family:'Sarasa Mono SC',ui-monospace,monospace;font-size:13.5px;
  background:var(--paper-soft);border-radius:3px;padding:2px 7px;letter-spacing:.02em}
.md-body pre{background:var(--paper-soft);border-radius:4px;padding:18px 22px;overflow:auto;
  margin:0 0 18px}
.md-body pre code{background:none;padding:0}
.md-body hr{border:none;border-top:1px solid var(--line);margin:44px 0}
.md-body a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--cinnabar);
  padding-bottom:1px;transition:opacity .4s}
.md-body a:hover{opacity:.65}
.md-body strong{font-weight:600;color:var(--ink)}

/* 用户文章 · 本人操作条 */
.uacts{display:flex;align-items:center;gap:20px;margin-top:56px;padding-top:22px;
  border-top:1px solid var(--line)}
.uacts a,.uacts button{font-size:11px;letter-spacing:.22em;color:var(--gray);
  text-decoration:none;background:none;border:none;cursor:pointer;font-family:var(--sans);
  padding:0;transition:color .4s}
.uacts a:hover,.uacts button:hover{color:var(--cinnabar)}
.uacts i{width:1px;height:12px;background:var(--line)}
/* 回到顶部 · 朱砂圆点（符号同篇末印记，自 endmark 横线行移入） */
.uacts .utop{width:9px;height:9px;flex:none;border:1px solid var(--cinnabar);border-radius:50%;
  transition:transform .6s var(--ease),background .6s var(--ease)}
.uacts .utop:hover{background:var(--cinnabar)}
.uacts .utop.closing{transform:scale(.25);background:var(--cinnabar)}

/* ---------- 上一篇 / 下一篇 ---------- */
.pn{
  max-width:660px;margin:0 0 40px;padding:0;border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;
}
.pn a{
  padding:36px 0;text-decoration:none;color:var(--ink);display:block;
}
.pn a+a{border-left:1px solid var(--line);padding-left:36px;text-align:right}
.pn .dir{font-size:10px;letter-spacing:.34em;color:var(--gray);text-transform:uppercase;
  display:block;margin-bottom:14px}
.pn .t{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.05em;
  transition:transform .5s var(--ease);display:inline-block}
.pn a:hover .t{transform:translateX(6px)}
.pn a+a:hover .t{transform:translateX(-6px)}

/* ---------- 出版物资质 · 竖排 / 悬挂 / 打印 ---------- */
/* 标点悬挂：句首引号括号挂出版心（Safari 等支持，渐进增强） */
.article p,.md-body p,.pull,.md-body blockquote{hanging-punctuation:first allow-end}

/* 长引文竖排：点击引文区在横排 / 竖排间切换 */
.pull,.md-body blockquote{cursor:pointer}
.pull.vert{writing-mode:vertical-rl;border-left:none;border-top:1px solid var(--ink);
  padding:24px 0 0;margin:56px auto;max-height:24em;letter-spacing:.16em;line-height:2.6}
.pull.vert small{margin-top:0;margin-right:18px}
.md-body blockquote.vert{writing-mode:vertical-rl;border-left:none;border-top:2px solid var(--cinnabar);
  padding:24px 0 0;margin:34px auto;max-height:24em;letter-spacing:.16em;line-height:2.6}

/* 打印专属页眉页脚（屏幕上不显示） */
.print-head,.print-foot{display:none}

@media print{
  html,html[data-theme="dark"]{
    --paper:#fdfcf8;--paper-soft:#f7f5ef;--ink:#1a1a1a;--charcoal:#1a1a1a;
    --gray:#4a4a44;--line:#ddd;--cinnabar:#b3402a;
  }
  @page{size:A4;margin:20mm 16mm 18mm;
    @bottom-right{content:counter(page) " / " counter(pages);font-size:8pt;font-family:serif}}
  body{background:#fdfcf8!important;color:#1a1a1a;padding-top:8mm;padding-bottom:8mm}
  .rv{opacity:1!important;transform:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,.toc,.uacts,.pn,.toc-back{display:none!important}
  .layout{display:block;max-width:100%;padding:0}
  .article{padding-top:10mm;max-width:100%}
  a{color:inherit;text-decoration:none;border-bottom:none}
  .article h1,.art-meta{break-after:avoid}
  .article h2,.md-body h1,.md-body h2{break-before:page;break-inside:avoid}
  .article h2:first-of-type,.md-body h1:first-child,.md-body h2:first-child{break-before:auto}
  p{orphans:3;widows:3}
  .pull,.sidenote,.endmark,.seeds{break-inside:avoid}
  .sidenote .sn-body{display:block!important;position:static;opacity:1;transform:none;
    pointer-events:auto;border-left:2px solid #b3402a;background:none;padding:2px 0 2px 14px}
  .print-head{display:flex;position:fixed;top:0;left:0;right:0;z-index:5;
    justify-content:space-between;align-items:baseline;
    font-family:var(--serif);font-size:9pt;letter-spacing:.24em;color:#1a1a1a;
    border-bottom:.5pt solid #ddd;padding-bottom:4pt}
  .print-foot{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;
    align-items:center;gap:12pt;font-size:9pt;color:#4a4a44}
  .print-foot .ln{flex:1;height:.5pt;background:#ddd}
  .print-foot .sq{width:7pt;height:7pt;border:1pt solid #b3402a;border-radius:50%}
}

footer{border-top:1px solid var(--line)}
.foot-inner{max-width:1180px;margin:0 auto;padding:64px 48px 48px;display:flex;
  justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.foot-motto{font-family:var(--serif);font-size:15px;letter-spacing:.34em;color:var(--charcoal)}
.foot-note{font-size:11px;color:var(--gray);letter-spacing:.16em;line-height:2.2;text-align:right}
.foot-note .en{display:block;letter-spacing:.28em;text-transform:uppercase}

.rv{opacity:0;transform:translateY(26px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.12s}.d2{transition-delay:.24s}.d3{transition-delay:.36s}

@media (max-width:960px){
  .layout{grid-template-columns:1fr;gap:0}
  .toc{display:none}
  .article{padding-top:160px}
}
@media (max-width:760px){
  header{padding:20px 22px}
  nav{gap:16px}
  nav a .en{display:none}
  .layout{padding:0 22px}
  .pn{grid-template-columns:1fr}
  .pn a+a{border-left:none;border-top:1px solid var(--line);padding-left:0;text-align:left}
  .seed{flex-wrap:wrap;gap:6px 22px}
}

/* 尊重系统「减少动态效果」设置：动效停，内容全显 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none}
}

/* ---- 出处块 · Phase 0 ---- */
.src-block{margin:26px 0 30px;padding:14px 20px;border-left:2px solid var(--cinnabar);
  background:var(--paper-soft);border-radius:0 4px 4px 0}
.src-lab{display:block;font-size:11.5px;letter-spacing:.12em;color:var(--gray);margin-bottom:8px}
.src-quote{margin:0 0 8px;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.9;color:var(--ink);opacity:.85}
.src-block .src-quote:last-of-type{margin-bottom:0}
.src-link{font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--cinnabar);padding-bottom:1px}
.src-link:hover{color:var(--cinnabar)}
.src-dead{border-bottom:none;color:var(--gray);font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
html[data-theme="dark"] .src-block{background:#232320}
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <span class="seal">马</span>
    <span class="brand-name">小马</span>
  </a>
  <nav>

<script>
/* 日夜切换 */

/* ===== 阅读控制：目录收起 / 页宽两档 / 沉浸阅读 ===== */
(function(){
  var layout=document.querySelector('.layout');
  var KEY_TOC='gdTocHide',KEY_W='gdReadWidth';

  /* 目录收起：收起后正文居中，恢复入口 fixed 左上（沉浸态下不可用，目录整体已隐藏） */
  function applyToc(hide){
    if(layout)layout.classList.toggle('no-toc',hide);
    try{localStorage.setItem(KEY_TOC,hide?'1':'0');}catch(e){}
  }
  document.addEventListener('click',function(e){
    var f=e.target.closest&&e.target.closest('#tocFold');
    if(f){e.preventDefault();applyToc(true);return;}
    var r=e.target.closest&&e.target.closest('#tocRestore');
    if(r){e.preventDefault();applyToc(false);return;}
  });
  try{if(localStorage.getItem(KEY_TOC)==='1')applyToc(true);}catch(e){}

  /* 页宽：适中（660）/ 铺满（1080，每行字更多），偏好持久化 */
  var rw=document.getElementById('rwBtn');
  function applyW(w){
    document.documentElement.classList.toggle('rw-wide',w==='full');
    if(rw){
      rw.classList.toggle('on',w==='full');
      rw.title=w==='full'?'页面宽度：铺满中，点击恢复适中':'页面宽度：适中，点击铺满（每行容纳更多字）';
    }
    try{localStorage.setItem(KEY_W,w);}catch(e){}
  }
  if(rw)rw.addEventListener('click',function(){
    applyW(document.documentElement.classList.contains('rw-wide')?'mid':'full');
  });
  var savedW='mid';
  try{savedW=localStorage.getItem(KEY_W)||'mid';}catch(e){}
  applyW(savedW==='full'?'full':'mid');

  /* 沉浸阅读：请求全屏 + 隐去目录 / 顶栏 / 页脚 / 上下篇；
     若环境拒绝全屏（iframe 预览等），CSS 沉浸态依然完整生效 */
  var immBtn=document.getElementById('immBtn'),immExit=document.getElementById('immExit');
  function enter(){
    document.documentElement.classList.add('imm');
    if(immBtn)immBtn.classList.add('on');
    var d=document.documentElement,p=null;
    try{p=d.requestFullscreen&&d.requestFullscreen();}catch(e){}
    if(p&&p.catch)p.catch(function(){});
  }
  function exit(){
    document.documentElement.classList.remove('imm');
    if(immBtn)immBtn.classList.remove('on');
    if(document.fullscreenElement&&document.exitFullscreen){
      var p=document.exitFullscreen();if(p&&p.catch)p.catch(function(){});
    }
  }
  /* 沉浸按钮本身即开关：图标随 html.imm 切换外扩 / 内收角 */
  if(immBtn)immBtn.addEventListener('click',function(){
    document.documentElement.classList.contains('imm')?exit():enter();
  });
  if(immExit)immExit.addEventListener('click',exit);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&document.documentElement.classList.contains('imm'))exit();
  });
  /* 浏览器原生退出全屏（F11 / Esc）时同步退出沉浸态 */
  document.addEventListener('fullscreenchange',function(){
    if(!document.fullscreenElement){
      document.documentElement.classList.remove('imm');
      if(immBtn)immBtn.classList.remove('on');
    }
  });
})();

/* ===== 复盘数据：localStorage 'reviewEntries' + 私有仓 reviews.json（GD.sync 同步） ===== */
var KEY='reviewEntries';
function loadRev(){
  try{
    var d=JSON.parse(localStorage.getItem(KEY));
    if(d&&d.items)return d;
  }catch(e){}
  return {items:[],del:[]};
}
function saveRev(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtD(s){
  var p=String(s||'').trim().split('-');
  return p.length===3?p[0]+' \u00b7 '+p[1]+' \u00b7 '+p[2]:esc(s||'');
}
/* 时间序（date 降序 = 近→远，与复盘列表一致）且未被墓碑标记 */
function alive(d){
  return d.items.filter(function(x){return x.id&&d.del.indexOf(x.id)<0;})
    .sort(function(a,b){return a.date<b.date?1:-1;});
}
function getId(){
  /* 路由：#r<时间戳+随机> 锚点优先，?id= 后备；#s1 等章节锚点不参与路由 */
  var m=/^#(r[a-z0-9]+)$/i.exec(location.hash);
  if(m)return m[1];
  m=/[?&]id=(r[a-z0-9]+)/i.exec(location.search);
  return m?m[1]:'';
}

function render(){
  var id=getId(),d=loadRev(),list=alive(d);
  var a=null,ai=-1;
  list.forEach(function(x,i){if(x.id===id){a=x;ai=i;}});
  var box=document.getElementById('articleBox');

  /* 空态：条目未到达（本人另一设备未同步）或访客（复盘不公开）——统一文案，不泄露条目存在性 */
  if(!a){
    document.title='复盘 — 小马';
    box.innerHTML='<p class="crumb rv in">复盘 REVIEW</p>'
      +'<h1 class="rv in">这一篇尚未到达</h1>'
      +'<p class="rv in" style="font-family:var(--serif);color:var(--gray);max-width:34em">'
      +'复盘记录在本机与私有云端之间同步。若你从列表点入，请<a href="review.html">返回复盘</a>重新打开；'
      +'若你是访客——复盘尚未公开。</p>';
    document.getElementById('pnBox').innerHTML='';
    return;
  }

  document.title=(a.title||'无题')+' — 小马';
  var md=document.querySelector('meta[name="description"]');
  if(md)md.setAttribute('content',String(a.body||'').replace(/[#>*`\-\[\]]/g,'').slice(0,80));

  var html='';
  html+='<p class="crumb rv">复盘 REVIEW <b>/</b> '+esc(a.cat||'复盘')+'</p>';
  html+='<h1 class="rv d1">'+esc(a.title||'无题')+'</h1>';
  html+='<div class="art-meta rv d2">'
    +'<span>'+esc(a.cat||'复盘')+'</span><i>\u00b7</i>'
    +'<span>'+fmtD(a.date)+'</span>'
    +(function(){
      if(!a.updated)return '';
      var t=new Date(a.updated),p=function(n){return String(n).length<2?'0'+n:n;};
      return '<i>\u00b7</i><span>修订 '+fmtD(t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()))+'</span>';
    })()
    +'</div>';
  html+='<div class="md-body rv d2">'+MD.render(a.body||'')+'</div>';

  /* 本人操作条：编辑（review-edit）/ 删除 / 返回列表 / 回顶朱砂圆点
     复盘数据只存在于本人设备与私有仓——能渲染出正文即本人视角 */
  html+='<div class="uacts rv"><a href="review-edit.html?id='+encodeURIComponent(id)+'">\u270e 编辑此文</a><i></i>'
    +'<button id="delArt" type="button">删除</button><i></i>'
    +'<a href="review.html">返回复盘 →</a><i></i>'
    +'<button class="utop" type="button" title="回到顶部" aria-label="回到页面顶部"></button></div>';
  box.innerHTML=html;
  MD.hydrate(box);

  /* 目录：从 Markdown 的 ## 标题自动生成 */
  var toc=document.getElementById('tocBox');
  var tocHTML='<button class="toc-fold" id="tocFold" type="button" title="收起目录，正文居中"><span class="sq"></span>收起目录</button>',n=0;
  box.querySelectorAll('.md-body h2').forEach(function(h){
    n++;h.id='s'+n;
    tocHTML+='<a href="#s'+n+'" data-spy="s'+n+'"><span class="no">'+n+'</span>'+esc(h.textContent)+'</a>';
  });
  tocHTML+='<a class="toc-back" href="review.html"><span class="sq"></span>返回复盘</a>';
  toc.innerHTML=tocHTML;

  /* 上一期 / 下一期：时间序相邻（ai+1 更早，ai-1 更新） */
  var prev=list[ai+1],next=list[ai-1];
  var pn=document.getElementById('pnBox');
  if(prev||next){
    var pnHTML='<a href="review-article.html#'+(prev?prev.id:'')+'"'+(prev?'':' style="visibility:hidden"')+'>'
      +'<span class="dir">← 上一期 · Prev</span>'
      +'<span class="t">'+esc(prev?prev.title:'')+'</span></a>';
    pnHTML+='<a href="review-article.html#'+(next?next.id:'')+'"'+(next?'':' style="visibility:hidden"')+'>'
      +'<span class="dir">下一期 · Next →</span>'
      +'<span class="t">'+esc(next?next.title:'')+'</span></a>';
    pn.className='pn rv';
    pn.innerHTML=pnHTML;
  }else{pn.innerHTML='';}

  /* 删除：墓碑随同步传播，渲染层一律跳过；无公开发布环节，仅私有仓 */
  var del=document.getElementById('delArt');
  if(del)del.addEventListener('click',function(){
    if(!confirm('删除《'+(a.title||'无题')+'》？此条将从所有设备移除。'))return;
    var dd=loadRev();
    dd.items=dd.items.filter(function(x){return x.id!==id;});
    dd.del.push(id);
    saveRev(dd);
    var done=function(){location.href='review.html';};
    if(GD.hasToken()){
      GD.sync('reviews.json',dd,GD.mergeReviews).then(done)
        .catch(function(e){alert('本机已删除，但云端同步尚未完成：'+e.message+'。请回列表重试。');});
    }else done();
  });

  reveal();
  spy();
}

function reveal(){
  var els=document.querySelectorAll('.rv');
  function show(el){el.classList.add('in');}
  if(!('IntersectionObserver' in window)){
    els.forEach(show);return;
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){show(e.target);io.unobserve(e.target);}});
  },{threshold:.1});
  els.forEach(function(el){io.observe(el);});
  /* 保底：1.6s 后，凡在首屏内仍未显示的直接显示，防止 io 异常导致白屏 */
  setTimeout(function(){
    els.forEach(function(el){
      if(el.classList.contains('in'))return;
      var r=el.getBoundingClientRect();
      if(r.top<window.innerHeight&&r.bottom>0)show(el);
    });
  },1600);
}

function spy(){
  var links={};
  document.querySelectorAll('.toc a[data-spy]').forEach(function(a){
    links[a.getAttribute('data-spy')]=a;
  });
  var heads=Object.keys(links).map(function(i){return document.getElementById(i);});
  var current=null;
  function update(){
    var pos=window.scrollY+window.innerHeight*0.28;
    var active=heads[0];
    heads.forEach(function(h){if(h&&h.offsetTop<=pos)active=h;});
    if(active!==current){
      current=active;
      Object.keys(links).forEach(function(id){
        links[id].classList.toggle('on',document.getElementById(id)===active);
      });
    }
  }
  window.addEventListener('scroll',update,{passive:true});
  update();
}

/* 渲染入口：本地即时渲染；有 Token 设备再拉私有仓合并重渲染（吸取 #u 闪错文教训：绝不先渲染无关内容） */
try{
  render();
  window.addEventListener('hashchange',function(){
    /* 只有 #r<id> 形式的锚点才切换条目；#s1 等章节锚点交给浏览器滚动 */
    if(/^#r[a-z0-9]+$/i.test(location.hash)){
      render();
      window.scrollTo(0,0);
    }
  });
  if(GD.hasToken()){
    GD.pull('reviews.json').then(function(r){
      if(r&&r.data){
        saveRev(GD.mergeReviews(loadRev(),r.data));
        render();
      }
    }).catch(function(){});
  }
  /* 概念层到位后注册索引并链接化全文 [[ ]] 占位 */
  GD.loadConcepts(function(dict){
    MD.setConcepts(GD.conceptsArray(dict));
    MD.linkWl(document);
  });
}catch(err){
  document.getElementById('articleBox').innerHTML=
    '<h1>复盘</h1><p>页面渲染遇到问题，请返回 <a href="review.html">复盘</a> 列表。</p>';
  document.querySelectorAll('.rv').forEach(function(el){el.classList.add('in');});
}

/* ---------- 出版物资质交互：篇末印记「收」/ 竖排 / 旁注 / 打印页眉 ---------- */
(function(){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* 篇末朱砂圆环：点击收缩为点，页归顶（收放呼应） */
  document.addEventListener('click',function(e){
    var q=e.target.closest&&e.target.closest('.endmark .sq,.uacts .utop');
    if(!q||q.classList.contains('closing'))return;
    q.classList.add('closing');
    window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
    setTimeout(function(){q.classList.remove('closing');},900);
  });
})();
(function(){
  /* 长引文点击切换横排 / 竖排；旁注圆环点击展开收起 */
  document.addEventListener('click',function(e){
    var q=e.target.closest&&e.target.closest('.pull,.md-body blockquote');
    if(q){q.classList.toggle('vert');return;}
    var d=e.target.closest&&e.target.closest('.sn-dot');
    if(d){
      var s=d.closest('.sidenote');
      var on=s.classList.toggle('open');
      d.setAttribute('aria-expanded',on?'true':'false');
    }
  });
})();
window.addEventListener('beforeprint',function(){
  var h=document.querySelector('.article h1');
  var t=document.getElementById('printTitle');
  if(h&&t)t.textContent=h.textContent.trim();
});
</script>
