<style>
main{max-width:880px;margin:0 auto;padding:0 48px}
.page-head{padding:150px 0 70px}
.crumb{font-size:11px;letter-spacing:.3em;color:var(--gray);margin-bottom:40px;text-transform:uppercase}
.crumb b{font-weight:400;color:var(--cinnabar)}
.page-head h1{font-family:var(--serif);font-size:clamp(40px,6vw,64px);font-weight:600;letter-spacing:.22em;line-height:1.2}
.page-head .en-title{font-size:12px;letter-spacing:.44em;color:var(--gray);text-transform:uppercase;margin-top:22px}
.lede{font-family:var(--serif);font-size:15.5px;line-height:2.2;color:var(--ink);opacity:.82;margin-top:30px}

/* ---- 工具行 ---- */
.tools{display:flex;gap:14px;align-items:center;margin-bottom:34px;flex-wrap:wrap}
.tools input[type="search"]{flex:1;min-width:220px;background:none;border:none;border-bottom:1px solid var(--line);
  font-family:var(--serif);font-size:15px;color:var(--ink);outline:none;padding:8px 2px;letter-spacing:.04em}
.tools input[type="search"]:focus{border-bottom-color:var(--ink)}
.cbtn{background:none;border:1px solid var(--line);border-radius:3px;padding:8px 18px;
  font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;letter-spacing:.1em;transition:.3s}
.cbtn:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.cbtn.primary{border-color:var(--cinnabar);color:var(--cinnabar)}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn:disabled:hover{border-color:var(--line);color:var(--ink)}
.hintline{font-size:12px;color:var(--gray);margin-left:auto}

/* ---- 概念卡列表 ---- */
.clist{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:60px}
@media (max-width:720px){.clist{grid-template-columns:1fr}}
.ccard{display:block;background:var(--paper-soft);border:1px solid var(--line);border-radius:6px;
  padding:22px 24px;text-decoration:none;color:var(--ink);transition:border-color .4s,transform .4s var(--ease)}
.ccard:hover{border-color:var(--cinnabar);transform:translateY(-2px)}
.ccard .cname{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.06em;margin-bottom:8px}
.ccard .cname i{font-style:normal;font-size:11.5px;color:var(--cinnabar);border:1px solid var(--cinnabar);
  border-radius:2px;padding:1px 6px;margin-left:10px;vertical-align:2px;letter-spacing:.1em}
.ccard .cdef{font-size:13.5px;line-height:1.9;color:var(--gray);margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .cmeta{font-size:11.5px;color:var(--gray);letter-spacing:.08em}
.ccard .cmeta b{font-weight:400;color:var(--ink)}
.c-empty{grid-column:1/-1;text-align:center;padding:70px 0;color:var(--gray);font-family:var(--serif);font-size:14.5px}

/* ---- 邻域 · RELATED ---- */
.nbhd{margin-top:50px}
.nbhd h4{font-size:12px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase;margin:0 0 6px}
.nbhd h4 b{color:var(--cinnabar);font-weight:normal}
.nlist{border-top:1px solid var(--line)}
.nrow{display:flex;align-items:baseline;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);position:relative}
.nname{font-family:var(--serif);font-size:16px;color:var(--ink);text-decoration:none;white-space:nowrap;transition:color .3s}
.nname:hover{color:var(--cinnabar)}
.ndir{font-size:10.5px;letter-spacing:.2em;color:var(--gray);white-space:nowrap}
.nwhy{margin:0;font-size:13.5px;line-height:1.8;color:var(--gray);flex:1}
.nsrc{font-size:11px;color:var(--cinnabar);text-decoration:none;white-space:nowrap}
.nacts{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--paper);padding-left:14px}
.nrow:hover .nacts{display:inline-flex;gap:10px}
.nedit,.ndel{background:none;border:none;cursor:pointer;font-size:12px;color:var(--gray);padding:2px}
.nedit:hover,.ndel:hover{color:var(--cinnabar)}
.nadd{margin-top:22px}
.rform select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:4px;
  padding:11px 12px;font-family:var(--serif);font-size:15px;color:var(--ink);margin:8px 0 20px}

/* ---- 同步状态入口 ---- */
.csync{font-size:12px;letter-spacing:.14em;color:var(--gray);text-decoration:none;
  margin-right:18px;white-space:nowrap;transition:color .3s}
.csync:hover{color:var(--cinnabar)}
.csync.on{color:#3d7a4f}

/* ---- Token 指引 ---- */
.tokhint{font-size:12.5px;line-height:1.9;color:var(--gray);background:var(--paper-soft);
  border-left:2px solid var(--cinnabar);padding:12px 16px;margin-bottom:26px}
.tokhint a{color:var(--cinnabar);text-decoration:underline;text-underline-offset:3px}

/* ---- 待建概念区 ---- */
.pending{background:var(--paper-soft);border:1px dashed var(--line);border-radius:6px;padding:20px 24px;margin-bottom:60px}
.pending h4{font-size:12px;letter-spacing:.22em;color:var(--gray);margin:0 0 12px;text-transform:uppercase}
.pending h4 b{font-weight:400;color:var(--cinnabar)}
.pending .prow{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:9px 0;border-bottom:1px solid var(--line)}
.pending .prow:last-child{border-bottom:none}
.pending .pname{font-family:var(--serif);font-size:14.5px}
.pending .pfrom{font-size:11px;color:var(--gray);margin-left:10px}

/* ---- 表单 ---- */
.cform{background:var(--paper-soft);border:1px solid var(--line);border-radius:6px;padding:26px 28px;margin-bottom:50px}
.cform h3{font-family:var(--serif);font-size:16px;letter-spacing:.14em;margin:0 0 18px;color:var(--ink)}
.cform h3 b{font-weight:400;font-size:11px;color:var(--cinnabar);letter-spacing:.2em;margin-left:10px}
.cform label{display:block;font-size:12px;color:var(--gray);letter-spacing:.1em;margin:14px 0 6px}
.cform input[type="text"],.cform textarea{width:100%;background:none;border:none;border-bottom:1px solid var(--line);
  font-family:inherit;font-size:14px;color:var(--ink);outline:none;padding:6px 2px}
.cform input:focus,.cform textarea:focus{border-bottom-color:var(--cinnabar)}
.cform textarea{resize:vertical;min-height:40px;line-height:1.8}
.cform .frow{display:flex;gap:18px;justify-content:flex-end;margin-top:20px}

/* ---- 详情 ---- */
.cdetail{margin-bottom:50px}
.cdetail .back{display:inline-block;font-size:12.5px;color:var(--gray);text-decoration:none;letter-spacing:.1em;margin-bottom:26px}
.cdetail .back:hover{color:var(--cinnabar)}
.cdetail h2{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:.1em;margin:0 0 6px}
.cdetail .caliases{font-size:13px;color:var(--gray);margin-bottom:22px;letter-spacing:.06em}
.cdetail .caliases b{font-weight:400;color:var(--ink)}
.cdetail .cdef-full{font-family:var(--serif);font-size:15.5px;line-height:2.2;color:var(--ink);opacity:.88;
  border-left:2px solid var(--cinnabar);padding:4px 0 4px 20px;margin-bottom:40px}
.cdetail h4{font-size:12px;letter-spacing:.22em;color:var(--gray);margin:0 0 16px;text-transform:uppercase}
.reflist{margin-bottom:36px}
.reflist a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.reflist a:hover{color:var(--cinnabar)}
.reflist .rt{font-family:var(--serif);font-size:15px}
.reflist .rd{font-size:11.5px;color:var(--gray);flex:none}
.cacts{display:flex;gap:14px;margin-top:30px}
</style>

<script>
(function(){
  var view=document.getElementById('view'),hintEl=document.getElementById('cHint'),
      searchIn=document.getElementById('cSearch');
  var all={},rels={},editing=null,own=false;

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmtT(ts){var d=new Date(Number(ts));if(isNaN(d))return '';
    return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}
  function hint(t){hintEl.textContent=t;setTimeout(function(){if(hintEl.textContent===t)hintEl.textContent='';},6000);}
  function persist(){GD.saveConceptsLocal(all);}
  function persistR(){GD.saveRelationsLocal(rels);}
  function arr(){return GD.conceptsArray(all).sort(function(a,b){return (b.updated||0)-(a.updated||0);});}

  /* ---- 反查引用：扫描随记与文章正文的 [[name]] / [[alias]] ---- */
  function refsOf(c){
    var names=[c.name].concat(c.aliases||[]).map(function(n){return String(n).trim();}).filter(Boolean);
    var out=[];
    /* 用户文章 */
    var arts={};
    try{arts=JSON.parse(localStorage.getItem('userArticles')||'{}');}catch(e){}
    Object.keys(arts).forEach(function(id){
      var a=arts[id];if(a.deleted||!a.body)return;
      var body=String(a.body);
      names.forEach(function(n){
        if(body.indexOf('[['+n+']]')>=0){out.push({k:id,title:a.title||'无题',d:a.updated||a.created||0,type:'article'});}
      });
    });
    /* 随记 */
    var frags=[];
    try{frags=JSON.parse(localStorage.getItem('fragments')||'[]');}catch(e){}
    frags.forEach(function(f){
      if(!f.text)return;
      names.forEach(function(n){
        if(String(f.text).indexOf('[['+n+']]')>=0){out.push({k:'f'+f.t,title:String(f.text).slice(0,26),d:f.t,type:'frag'});}
      });
    });
    out.sort(function(a,b){return b.d-a.d;});
    /* 去重（同一来源被多个别名命中） */
    var seen={},res=[];
    out.forEach(function(x){if(!seen[x.k+x.title]){seen[x.k+x.title]=1;res.push(x);}});
    return res;
  }

  /* ---- 待建概念：文中 [[ ]] 提及但未建的名字（引用不自动建概念，此处收口） ---- */
  function pendingNames(){
    var known={},names={},re=/\[\[([^\]\n]+)\]\]/g;
    arr().forEach(function(c){known[c.name]=1;(c.aliases||[]).forEach(function(a){known[String(a).trim()]=1;});});
    function scan(text,where){
      var m;re.lastIndex=0;
      while((m=re.exec(String(text||'')))){
        var n=m[1].trim();
        if(n&&!known[n]&&!names[n])names[n]={name:n,from:where};
      }
    }
    var arts={};try{arts=JSON.parse(localStorage.getItem('userArticles')||'{}');}catch(e){}
    Object.keys(arts).forEach(function(id){
      var a=arts[id];if(!a.deleted&&a.body)scan(a.body,a.title||'文章');
    });
    var frags=[];try{frags=JSON.parse(localStorage.getItem('fragments')||'[]');}catch(e){}
    frags.forEach(function(f){if(f.text)scan(f.text,'随记');});
    return Object.keys(names).map(function(k){return names[k];});
  }
  function renderPending(){
    var pend=pendingNames();
    if(!pend.length)return '';
    return '<div class="pending"><h4>待建 · <b>'+pend.length+'</b> 个文中提及的概念</h4>'
      +pend.map(function(p,i){
        return '<div class="prow"><span class="pname">'+esc(p.name)
          +'<span class="pfrom">出自 '+esc(p.from)+'</span></span>'
          +'<button class="cbtn" data-pend="'+i+'" type="button">一键建</button></div>';
      }).join('')+'</div>';
  }

  /* ---------- 视图 ---------- */
  function renderList(){
    location.hash='';
    var q=searchIn.value.trim().toLowerCase();
    var list=arr().filter(function(c){
      if(!q)return true;
      return (c.name+' '+(c.aliases||[]).join(' ')+' '+(c.def||'')).toLowerCase().indexOf(q)>=0;
    });
    var html='';
    if(!list.length){
      html='<div class="clist"><div class="c-empty">还没有概念。在文章里写 <b style="color:var(--cinnabar)">[[概念名]]</b>，或点右上「新建概念」——第一株别嫌小。</div></div>';
    }else{
      html='<div class="clist">'+list.map(function(c){
        var refs=refsOf(c).length;
        return '<a class="ccard" href="#'+encodeURIComponent(c.id)+'">'
          +'<div class="cname">'+esc(c.name)+'<i>概念</i></div>'
          +(c.def?'<div class="cdef">'+esc(c.def)+'</div>':'')
          +'<div class="cmeta"><b>'+refs+'</b> 处引用 · 别名 '+(c.aliases||[]).length+' · '+fmtT(c.updated)+'</div>'
          +'</a>';
      }).join('')+'</div>';
    }
    view.innerHTML=tokenHint()+html+renderPending();
    view.querySelectorAll('[data-pend]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var p=pendingNames()[Number(btn.getAttribute('data-pend'))];
        if(!p)return;
        openForm({id:null,name:p.name,aliases:[],def:'',fromPending:true});
      });
    });
  }

  /* ---------- 关系层（Phase 2）：单概念邻域视图 ---------- */
  function relHtml(id,c){
    var edges=[];
    for(var k in rels){
      var e=rels[k];
      if(e.deleted)continue;
      if(e.from===id&&all[e.to]&&!all[e.to].deleted)edges.push({e:e,other:e.to,dir:'→'});
      else if(e.to===id&&all[e.from]&&!all[e.from].deleted)edges.push({e:e,other:e.from,dir:'←'});
    }
    edges.sort(function(a,b){return b.e.updated-a.e.updated;});
    var html='<div class="nbhd rv"><h4>邻域 · RELATED <b>'+edges.length+'</b></h4>';
    html+=edges.length?'<div class="nlist">'+edges.map(function(x){
      var o=all[x.other];
      return '<div class="nrow">'
        +'<a class="nname" href="concept.html#'+esc(x.other)+'">'+esc(o.name)+'</a>'
        +'<span class="ndir">'+(x.dir==='→'?'指向':'来自')+'</span>'
        +'<p class="nwhy">'+esc(x.e.why)+'</p>'
        +(x.e.src&&x.e.src.u?'<a class="nsrc" href="'+esc(x.e.src.u)+'" target="_blank" rel="noopener">出处↗</a>':'')
        +(own?'<span class="nacts"><button class="nedit" data-redge="'+esc(x.e.id)+'" type="button">改</button><button class="ndel" data-redge="'+esc(x.e.id)+'" type="button">删</button></span>':'')
        +'</div>';
    }).join('')+'</div>'
      :'<p class="c-empty">尚无关联概念——概念不是孤岛，把它放进网络里才立得住。</p>';
    html+=(own?'<button class="cbtn nadd" id="relAdd" type="button">＋ 关联概念</button>':'')+'</div>';
    return html;
  }
  function openRelForm(id,edge){
    var opts=[];
    for(var k in all){
      if(k===id||all[k].deleted||!all[k].name)continue;
      opts.push('<option value="'+esc(k)+'"'+(edge&&edge.to===k?' selected':'')+'>'+esc(all[k].name)+'</option>');
    }
    if(!opts.length){hint('先再建一个概念，才能建立关联');return;}
    view.innerHTML='<div class="cform rform">'
      +'<h3>'+(edge?'编辑关系':'关联概念')+'<b>RELATED</b></h3>'
      +'<label>关联到</label><select id="rTo">'+opts.join('')+'</select>'
      +'<label>为什么相关 *</label><textarea id="rWhy" rows="2" placeholder="这条关系为什么成立？一句话说清。空泛的连线不如不连。">'+esc(edge?edge.why:'')+'</textarea>'
      +'<label>出处链接（可选）</label><input type="url" id="rSrcU" value="'+esc(edge&&edge.src?edge.src.u||'':'')+'" placeholder="这条关系来自哪里 https://…">'
      +'<div class="frow"><button class="cbtn" id="rCancel" type="button">取消</button>'
      +'<button class="cbtn primary" id="rSave" type="button">保存</button></div></div>';
    document.getElementById('rCancel').addEventListener('click',function(){render();});
    document.getElementById('rSave').addEventListener('click',function(){
      var to=document.getElementById('rTo').value;
      var why=document.getElementById('rWhy').value.trim();
      if(!why){document.getElementById('rWhy').focus();return;}
      var u=document.getElementById('rSrcU').value.trim();
      var src=u?{u:u}:null;
      if(edge){edge.to=to;edge.why=why;edge.src=src;edge.updated=Date.now();}
      else{
        var rid='r'+Date.now();
        rels[rid]={id:rid,from:id,to:to,why:why,src:src,updated:Date.now()};
      }
      persistR();hint(edge?'关系已更新 · 记得「发布概念」':'已连上 · 记得「发布概念」');
      syncAll();render();
    });
  }
  function bindRel(id){
    var add=document.getElementById('relAdd');
    if(add)add.addEventListener('click',function(){openRelForm(id,null);});
    view.querySelectorAll('[data-redge]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var e=rels[btn.getAttribute('data-redge')];
        if(!e)return;
        if(btn.className==='ndel'){
          if(!confirm('删除这条关联？'))return;
          e.deleted=true;e.updated=Date.now();persistR();
          hint('已删除关联 · 记得「发布概念」');syncAll();render();
        }else openRelForm(id,e);
      });
    });
  }

  function renderDetail(id){
    var c=all[id];
    if(!c||c.deleted){renderList();return;}
    var refs=refsOf(c);
    var html='<div class="cdetail">'
      +'<a class="back" href="concept.html">← 返回概念列表</a>'
      +'<h2>'+esc(c.name)+'</h2>'
      +'<p class="caliases">别名 · <b>'+(c.aliases&&c.aliases.length?esc(c.aliases.join(' / ')):'无')+'</b></p>'
      +(c.def?'<p class="cdef-full">'+esc(c.def)+'</p>':'')
      +'<h4>被引用 · '+refs.length+' 处</h4>'
      +'<div class="reflist">'
      +(refs.length?refs.map(function(r){
        var href=r.type==='article'?'article.html#'+encodeURIComponent(r.k):'notes.html#f'+r.k.slice(1);
        return '<a href="'+href+'"><span class="rt">'+(r.type==='frag'?'随记 · ':'')+esc(r.title)+'</span><span class="rd">'+fmtT(r.d)+'</span></a>';
      }).join(''):'<p class="c-empty" style="padding:30px 0">尚无引用——在文章或随记里写 [['+esc(c.name)+']] 便会汇入。</p>')
      +'</div>'
      +'<div class="cacts">'
      +(own?'<button class="cbtn" id="editC" type="button">编辑</button><button class="cbtn" id="delC" type="button">删除</button>':'')
      +'</div>'+relHtml(id,c)+'</div>';
    view.innerHTML=html;
    bindRel(id);
    if(own){
      document.getElementById('editC').addEventListener('click',function(){openForm(c);});
      document.getElementById('delC').addEventListener('click',function(){
        if(!confirm('删除概念「'+c.name+'」？文章中的 [[ ]] 将退回纯文本。'))return;
        c.deleted=true;c.updated=Date.now();persist();
        hint('已删除 · 记得「发布概念」同步到公开站点');
        syncAll();renderList();
      });
    }
  }

  var hasToken=false;try{hasToken=GD.hasToken();}catch(e){}
  function tokenHint(){
    return hasToken?'':'<p class="tokhint">云端同步未开启：概念暂存于本机浏览器，换设备或清理数据会丢。'
      +'到 <a href="now.html">现在页 · 同步设置</a> 配置 GitHub Token（需授权 digital-garden-data 与 digital-garden 两仓）后，'
      +'点「发布概念」即可存入私有仓、公开可见。</p>';
  }

  function openForm(c){
    var isEdit=!!c;
    view.innerHTML=tokenHint()+'<div class="cform">'
      +'<h3>'+((isEdit&&!c.fromPending)?'编辑概念':'新建概念')+'<b>CONCEPT</b></h3>'
      +'<label>名称 *</label><input type="text" id="fName" value="'+esc(c?c.name:'')+'" placeholder="例：美债期限溢价">'
      +'<label>别名（逗号分隔，可选）</label><input type="text" id="fAlias" value="'+esc(c?(c.aliases||[]).join(', '):'')+'" placeholder="例：期限溢价, term premium">'
      +'<label>一句话定义（可选）</label><textarea id="fDef" placeholder="这个概念是什么？用一句话立住它。">'+esc(c?c.def||'':'')+'</textarea>'
      +'<div class="frow"><button class="cbtn" id="fCancel" type="button">取消</button>'
      +'<button class="cbtn primary" id="fSave" type="button">保存</button></div></div>';
    document.getElementById('fCancel').addEventListener('click',function(){render();});
    document.getElementById('fSave').addEventListener('click',function(){
      var name=document.getElementById('fName').value.trim();
      if(!name){document.getElementById('fName').focus();return;}
      var aliases=document.getElementById('fAlias').value.split(/[,，、]/).map(function(s){return s.trim();}).filter(Boolean);
      var def=document.getElementById('fDef').value.trim();
      if(isEdit&&!c.fromPending){c.name=name;c.aliases=aliases;c.def=def;c.updated=Date.now();}
      else{
        var id='c'+Date.now();
        all[id]={id:id,name:name,aliases:aliases,def:def,updated:Date.now()};
      }
      persist();
      hint(isEdit?'已更新 · 点右上「发布概念」才会上云':'已保存到本机 · 点右上「发布概念」才会上云');
      syncAll();
      location.hash='#'+((isEdit&&!c.fromPending)?c.id:id);
      render();
    });
  }

  /* ---------- 同步 / 发布 ---------- */
  function syncAll(){
    if(!GD.hasToken())return;
    GD.syncConcepts(all).then(function(m){
      /* GD.sync 返回 {data:…, ok:true} 包装——解包再赋值 */
      var d=(m&&m.data)?m.data:m;
      if(d){all=d;persist();}
      return GD.syncRelations(rels);
    }).then(function(m){
      var d=(m&&m.data)?m.data:m;
      if(d){rels=d;persistR();}
      render();
    }).catch(function(){});
  }

  document.getElementById('pubBtn').addEventListener('click',function(){
    if(!GD.hasToken()){hint('未设置同步 Token——概念先存于本机');return;}
    var b=this;b.disabled=true;hint('发布中…');
    GD.publishConcepts(all).then(function(){
      return GD.publishRelations(rels,all);
    }).then(function(){
      hint('概念与关系已发布 · 公开站点约 1 分钟后可见');
    }).catch(function(e){
      var m=e.message||'';
      if(/404|403|Not Found/.test(m))m='无权限写入公开仓库——到「现在页」检查 Token 是否同时授权了 digital-garden（公开仓），只授私库会一直失败';
      hint('发布失败：'+m);
    }).finally(function(){b.disabled=false;});
  });
  (function(){
    var el=document.getElementById('syncLink');
    var on=false;try{on=GD.hasToken();}catch(e){}
    el.textContent=on?'● 同步已开启':'○ 同步未开启';
    el.className='csync'+(on?' on':'');
  })();
  document.getElementById('newBtn').addEventListener('click',function(){openForm(null);});
  searchIn.addEventListener('input',function(){if(!editing)renderList();});

  function render(){
    var m=/^#(c\d+)/i.exec(location.hash);
    editing=m?m[1]:null;
    if(editing)renderDetail(editing);else renderList();
  }
  window.addEventListener('hashchange',render);

  /* 初始化 */
  try{own=GD.hasToken()||!!localStorage.getItem('userArticles');}catch(e){}
  GD.loadRelations(function(m){
    all=m.concepts;rels=m.rels;
    MD.setConcepts(GD.conceptsArray(all));
    render();
  });
})();
</script>
</body>
</html>
