<style>
:root{
  --paper:#f6f4ee; --paper-soft:#efece4; --ink:#1c1c1a; --charcoal:#2b2b28;
  --gray:#8a877d; --line:rgba(28,28,26,.16); --line-strong:rgba(28,28,26,.4);
  --cinnabar:#b3402a;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
.meta-row select option,.meta-row input[type=date]{
  background:var(--paper);color:var(--ink);}
html[data-theme="dark"]{
  --paper:#141412; --paper-soft:#1b1b18; --ink:#e9e6de; --charcoal:#d6d3ca;
  --gray:#7d7a71; --line:rgba(233,230,222,.16); --line-strong:rgba(233,230,222,.42);
  --cinnabar:#c8503a;
}
html[data-theme="dark"] .meta-row select option,
html[data-theme="dark"] .meta-row input[type=date]{
  background:#1b1b18;color:var(--ink)}
html[data-theme="dark"] .meta-row input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.85)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;
  letter-spacing:.02em;transition:background .9s var(--ease),color .9s var(--ease);
  -webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:var(--paper)}

header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;
  justify-content:space-between;align-items:center;padding:28px 48px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.seal{width:24px;height:24px;background:var(--cinnabar);display:flex;align-items:center;
  justify-content:center;color:#f6f4ee;font-family:var(--serif);font-size:12px;font-weight:600}
.brand-name{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.12em}
nav{display:flex;align-items:center;gap:34px}
nav a{color:var(--ink);text-decoration:none;font-size:13px;letter-spacing:.14em;
  position:relative;padding:4px 0;opacity:.75;transition:opacity .4s}
nav a:hover,nav a.cur{opacity:1}
nav a .en{font-size:10px;letter-spacing:.18em;color:var(--gray);margin-left:6px}

.taiji{width:24px;height:24px;border:none;background:transparent;cursor:pointer;
  padding:0;flex:none;color:var(--ink)}
.taiji svg{display:block;width:100%;height:100%;overflow:visible}
.taiji .ring{fill:none;stroke:currentColor;stroke-width:1;opacity:.55;transition:opacity .5s}
.taiji .disc{transform-origin:12px 12px;transition:transform 1.1s var(--ease)}
html[data-theme="dark"] .taiji .disc{transform:rotate(180deg)}
.taiji .half{fill:currentColor;opacity:0;transform-origin:12px 12px;transform:rotate(-100deg);
  transition:opacity .7s var(--ease),transform .9s var(--ease)}
.taiji:hover .half{opacity:1;transform:rotate(0)}
.taiji .d1,.taiji .d2{opacity:0;transition:opacity .7s var(--ease) .1s}
.taiji:hover .d1,.taiji:hover .d2{opacity:1}
.taiji .d1{fill:var(--paper)}
.taiji .d2{fill:currentColor}
.taiji .still{fill:currentColor;transition:opacity .5s}
.taiji:hover .still{opacity:0}

main{max-width:860px;margin:0 auto;padding:0 48px}

/* 页头（编辑台页压扁，把空间留给编辑器） */
.page-head{padding:150px 0 30px}
.crumb{font-size:11px;letter-spacing:.3em;color:var(--gray);margin-bottom:24px;text-transform:uppercase}
.crumb b{font-weight:400;color:var(--cinnabar)}
.crumb a{color:var(--gray);text-decoration:none;border-bottom:1px solid transparent;transition:all .4s}
.crumb a:hover{color:var(--ink);border-bottom-color:var(--cinnabar)}
.page-head h1{font-family:var(--serif);font-size:clamp(30px,4vw,40px);font-weight:600;
  letter-spacing:.22em;line-height:1.2}
.page-head .lede{margin-top:18px;font-family:var(--serif);font-size:14px;line-height:2.2;
  color:var(--charcoal);letter-spacing:.1em}

/* 工具栏 */

.bar .t{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.14em}
.bar .r{font-size:11px;letter-spacing:.16em;color:var(--gray);display:flex;align-items:center;gap:10px}

.bar .r.ok i{background:var(--cinnabar)}

/* 编辑器 */

#titleInput{width:100%;background:none;border:none;outline:none;
  font-family:var(--serif);font-size:clamp(24px,4vw,32px);font-weight:600;
  letter-spacing:.08em;color:var(--ink);padding:6px 0 14px;border-bottom:1px solid transparent;
  transition:border-color .5s}
#titleInput:focus{border-bottom-color:var(--line)}
#titleInput::placeholder{color:var(--gray);opacity:.55}
.meta-row{display:flex;align-items:center;gap:26px;flex-wrap:wrap;
  padding:20px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--gray)}
.meta-row select{background:none;border:none;border-bottom:1px solid var(--line);
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--ink);
  padding:4px 2px;outline:none;cursor:pointer}
.meta-row input[type=date]{background:none;border:none;border-bottom:1px solid var(--line);
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--ink);
  padding:4px 2px;outline:none}
.meta-row .rev{margin-left:auto}
.tabs{display:flex;gap:26px;padding:18px 0 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;cursor:pointer;font-family:var(--serif);
  font-size:14px;letter-spacing:.2em;color:var(--gray);padding:8px 2px;position:relative;
  transition:color .4s}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;

#bodyTa{width:100%;min-height:440px;background:none;border:none;outline:none;resize:vertical;
  font-family:var(--serif);font-size:16px;line-height:2.3;letter-spacing:.04em;color:var(--ink);
  padding:26px 0}
#bodyTa::placeholder{color:var(--gray);opacity:.55}
#pv{display:none;min-height:440px;padding:26px 0;overflow-wrap:break-word}

/* 预览区排版（与文章页 Markdown 正文同风格） */
#pv h2{font-family:var(--serif);font-size:clamp(20px,3vw,26px);font-weight:600;
  letter-spacing:.06em;margin:56px 0 8px;padding-top:26px;border-top:1px solid var(--line)}
#pv h2:first-child{margin-top:0;border-top:none;padding-top:0}
#pv h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:40px 0 6px}
#pv p{margin:0 0 18px;font-family:var(--serif);font-size:16px;line-height:2.3;
  letter-spacing:.04em;color:var(--ink)}
#pv ul,#pv ol{margin:0 0 18px;padding-left:26px}
#pv li{margin-bottom:10px;font-family:var(--serif);font-size:15.5px;line-height:2.1}
#pv blockquote{margin:30px 0;padding:2px 0 2px 22px;border-left:2px solid var(--cinnabar);
  font-family:var(--serif);font-size:15.5px;line-height:2.2;color:var(--charcoal)}
#pv code{font-family:ui-monospace,monospace;font-size:13px;background:var(--paper-soft);
  border-radius:3px;padding:2px 7px}
#pv pre{background:var(--paper-soft);border-radius:4px;padding:18px 22px;overflow:auto;margin:0 0 18px}
#pv pre code{background:none;padding:0}
#pv hr{border:none;border-top:1px solid var(--line);margin:40px 0}
#pv a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--cinnabar)}
#pv strong{font-weight:600}
.cheat{font-size:11px;letter-spacing:.1em;color:var(--gray);line-height:2.2;
  padding:16px 0;border-top:1px solid var(--line)}
.cheat code{font-family:ui-monospace,monospace;background:var(--paper-soft);
  border-radius:3px;padding:1px 6px;color:var(--charcoal)}

/* 动作行 */
.acts{display:flex;align-items:center;gap:24px;padding:34px 0 10px;flex-wrap:wrap}
.acts button{display:inline-flex;align-items:center;gap:14px;background:none;border:none;

.acts button:hover{opacity:.6}
.acts .rr{width:8px;height:8px;border-radius:50%;background:var(--cinnabar);flex:none}
.acts .rr-hollow{background:none;border:1px solid var(--ink)}
.acts .danger{color:var(--gray);font-weight:400}
.acts .danger:hover{color:var(--cinnabar);opacity:1}
.acts .hint{font-size:11px;letter-spacing:.14em;color:var(--gray)}
.acts .hint b{font-weight:400;color:var(--cinnabar)}

footer{border-top:1px solid var(--line);margin-top:60px}
.foot-inner{max-width:1080px;margin:0 auto;padding:56px 48px 48px;display:flex;

.foot-note{font-size:11px;color:var(--gray);letter-spacing:.16em;line-height:2.2;text-align:right}
.foot-note .en{display:block;letter-spacing:.28em;text-transform:uppercase}

@media(max-width:720px){

  .meta-row{gap:16px}
  .acts{gap:16px}
  .foot-inner{padding:44px 22px 36px;flex-direction:column;align-items:flex-start}
}

<script>
/* ===== 复盘编辑台 =====
   数据：localStorage 'reviewEntries' {items,del} → GD.sync('reviews.json') 私有仓跨设备同步
   URL：无 id 新建；?id=rxxx 编辑既有条目 */
(function(){
  var KEY='reviewEntries';
  var $=function(id){return document.getElementById(id);};
  var titleIn=$('titleInput'),catSel=$('catSel'),dateIn=$('dateInput'),
      revInfo=$('revInfo'),bodyTa=$('bodyTa'),pv=$('pv'),
      tabEdit=$('tabEdit'),tabPv=$('tabPv'),actHint=$('actHint'),
      syncHint=$('syncHint'),syncText=$('syncText'),delBtn=$('delBtn');
  var editingId=null;

  function load(){
    var d={items:[],del:[]};
    try{var raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.items)d=raw;}catch(e){}
    return d;
  }
  function save(d){localStorage.setItem(KEY,JSON.stringify(d));}
  function todayStr(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

  function fill(r){
    editingId=r?r.id:null;
    titleIn.value=r?r.title:'';
    catSel.value=r?r.cat:'周复盘';
    dateIn.value=r?r.date:todayStr();
    bodyTa.value=r?(r.body||''):'';
    metaUpdate();
  }
  function metaUpdate(){
    if(!editingId){revInfo.textContent='新复盘 · 未保存';delBtn.hidden=true;return;}
    var r=findItem(editingId);
    if(!r){revInfo.textContent='新复盘 · 未保存';delBtn.hidden=true;return;}
    revInfo.textContent=(r.created?'已存 ':'')+(r.updated?'修订 '+fmtTs(r.updated):'');
    delBtn.hidden=false;
  }
  function findItem(id){return load().items.filter(function(x){return x.id===id;})[0];}
  function fmtTs(ts){var d=new Date(ts),p=function(n){return String(n).padStart(2,'0');};
    return d.getFullYear()+'·'+p(d.getMonth()+1)+'·'+p(d.getDate());}

  function renderPv(){pv.innerHTML=MD.render(bodyTa.value);}
  var pvMode=false;
  function setMode(p){
    pvMode=p;
    bodyTa.style.display=p?'none':'block';
    pv.style.display=p?'block':'none';
    tabEdit.classList.toggle('on',!p);
    tabPv.classList.toggle('on',p);
    if(p)renderPv();
  }
  tabEdit.addEventListener('click',function(){setMode(false);});
  tabPv.addEventListener('click',function(){setMode(true);});

  /* ---------- 云端 ---------- */
  function syncPrivate(silent){
    if(!GD.hasToken()){syncText.textContent='未设 Token · 仅本地';return;}
    syncText.textContent='同步中…';
    syncHint.classList.remove('ok');
    GD.sync('reviews.json',load(),GD.mergeReviews).then(function(r){
      save(r.data);
      syncHint.classList.add('ok');
      syncText.textContent='已同步云端';
      metaUpdate();
    }).catch(function(e){
      syncText.textContent='云端同步失败 · 本地已保存';
      if(!silent)hint('同步失败：'+e.message);
    });
  }
  $('syncBtn').addEventListener('click',function(){syncPrivate();hint('已发起云端同步');});

  /* ---------- 保存 ---------- */
  function doSave(){
    var title=titleIn.value.trim();
    if(!title){titleIn.focus();hint('先写标题');return;}
    var d=load(),now=Date.now(),isNew=!editingId;
    var id=editingId||('r'+now+String(Math.random()).slice(2,6));
    var old=editingId?d.items.filter(function(x){return x.id===id;})[0]:null;
    var rec={id:id,title:title,cat:catSel.value,
      date:dateIn.value||todayStr(),body:bodyTa.value,
      created:old?old.created:now,updated:now};
    d.items=d.items.filter(function(x){return x.id!==id;});
    d.items.push(rec);
    d.items.sort(function(a,b){return a.date<b.date?1:-1;});
    save(d);
    editingId=id;
    metaUpdate();
    if(isNew&&history.replaceState)history.replaceState(null,'','?id='+id);
    hint(isNew?'已保存（新复盘）':'已保存 · 修订 '+fmtTs(now));
    syncPrivate();
  }
  $('saveBtn').addEventListener('click',doSave);

  /* ---------- 删除 ---------- */
  delBtn.addEventListener('click',function(){
    if(!editingId||!findItem(editingId)){hint('当前没有已保存的复盘');return;}
    if(!confirm('删除《'+(findItem(editingId).title||'无题')+'》？将从所有设备移除。'))return;
    var d=load();
    d.items=d.items.filter(function(x){return x.id!==editingId;});
    d.del.push(editingId);
    save(d);
    location.href='review.html';
  });

  /* ---------- 导入 .md ----------
     解析顺序：YAML 头（--- 包裹，可选 title/cat/date）→ 正文首个 # 一级标题做题名（剥离出正文）→ 文件名兜底；
     填入当前编辑器（不自动保存，用户确认后再点保存） */
  function importMd(text,fname){
    text=String(text).replace(/^\uFEFF/,'');
    var fm=null,m=text.match(/^---\r?\n([\s\S]*?)\r?\n---\s*\r?\n?/);
    if(m){fm={};m[1].split(/\r?\n/).forEach(function(l){
      var p=l.match(/^([A-Za-z_]+)\s*:\s*(.+)$/);
      if(p)fm[p[1].toLowerCase()]=p[2].trim().replace(/^["']|["']$/g,'');
    });text=text.slice(m[0].length).replace(/^\s+/,'');}
    var h1='';
    var h=text.match(/^#[ \t]+([^\r\n]+)/);
    if(h){h1=h[1].trim();text=text.slice(h.index+h[0].length).replace(/^\s+/,'');}
    var title=(fm&&fm.title)||(h1)||fname.replace(/\.(md|markdown|txt)$/i,'');
    var cat=catSel.value;
    if(fm&&fm.cat&&['周复盘','月复盘','季度复盘'].indexOf(fm.cat)>=0)cat=fm.cat;
    var date=(fm&&fm.date&&/^\d{4}-\d{2}-\d{2}$/.test(fm.date))?fm.date:todayStr();
    /* 导入 = 另起新篇：脱离当前编辑对象，防止覆盖正在编辑的复盘 */
    editingId=null;
    if(history.replaceState)history.replaceState(null,'',location.pathname);
    fill({id:null,title:title,cat:cat,date:date,body:text,
      created:null,updated:null});
    fillFormTail(date);
    hint('已导入《'+title+'》——确认无误后点「保存」');
  }
  /* 导入后 revInfo 显示新态 */
  function fillFormTail(date){dateIn.value=date;}
  $('impBtn').addEventListener('click',function(){impFile.click();});
  var impFile=$('impFile');
  impFile.addEventListener('change',function(){
    var fs=[].slice.call(impFile.files||[]);
    impFile.value='';
    if(!fs.length)return;
    var f=fs[0];
    var rd=new FileReader();
    rd.onload=function(){importMd(rd.result,f.name);};
    rd.onerror=function(){hint('读取 '+f.name+' 失败');};
    rd.readAsText(f);
  });

  function hint(s){
    actHint.textContent=s;
    clearTimeout(hint._t);
    hint._t=setTimeout(function(){actHint.textContent='';},6000);
  }

  /* ---------- 启动：URL ?id= 回填 + 云端拉取 ---------- */
  var id=null,mId=location.search.match(/[?&]id=([^&]+)/);
  if(mId)id=decodeURIComponent(mId[1]);
  var local=load(),rec=id?local.items.filter(function(x){return x.id===id;})[0]:null;
  fill(rec||null);
  if(rec){
    if(history.replaceState)history.replaceState(null,'','?id='+rec.id);
  }else if(id){
    /* 云端可能才有（换设备打开旧链接）：拉取合并后重试回填 */
    if(GD.hasToken()){
      GD.pull('reviews.json').then(function(r){
        if(!r||!(r.data&&r.data.items))return null;
        save(GD.mergeReviews(load(),r.data));
        var rec2=load().items.filter(function(x){return x.id===id;})[0];
        if(rec2){fill(rec2);hint('已从云端载入');}
        return null;
      }).catch(function(){});
    }
  }
  syncPrivate(true);
})();
</script>
</body>
</html>
