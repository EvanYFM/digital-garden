<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="dg-title dg-desc">
  <title id="dg-title">小马的数字花园</title>
  <desc id="dg-desc">现代东方极简主义个人网站：像一本持续修订的个人思想出版物，包含思考、研究、项目、复盘与观。</desc>

  <defs>
    <style>
      .serif { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; }
      .sans  { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .paper { fill: #e9e6de; }
      .gray  { fill: #7d7a71; }
      .cinnabar { fill: #c8503a; }
      .dim   { fill: #b9b5a8; }
    </style>
  </defs>

  <!-- 深墨底（项目夜间模式） -->
  <rect width="1200" height="360" fill="#141412"/>

  <!-- 左：标题区 -->
  <g transform="translate(56 0)">
    <!-- 副层：持续修订 -->
    <text class="sans gray" x="0" y="72" font-size="17" letter-spacing="0.3em">个人网站 · 持续修订</text>

    <!-- 主标题 -->
    <text class="serif paper" x="0" y="156" font-size="70" letter-spacing="0.08em" font-weight="600">小马的数字花园</text>

    <!-- 朱砂印章「马」：方形是品牌唯一方形元素 -->
    <g transform="translate(560 108)">
      <rect width="46" height="46" fill="none" stroke="#c8503a" stroke-width="2"/>
      <text class="serif cinnabar" x="23" y="33" font-size="27" text-anchor="middle">马</text>
    </g>

    <!-- 一句话定位 -->
    <text class="sans dim" x="0" y="216" font-size="22" letter-spacing="0.14em">现代东方极简主义 · 克制 留白 长期主义</text>

    <!-- 栏目行：思考 / 研究 / 项目 / 复盘 / 观 / 此刻 -->
    <text class="serif paper" x="0" y="280" font-size="21" letter-spacing="0.22em">
      <tspan>思考</tspan><tspan fill="#7d7a71"> · </tspan>
      <tspan>研究</tspan><tspan fill="#7d7a71"> · </tspan>
      <tspan>项目</tspan><tspan fill="#7d7a71"> · </tspan>
      <tspan>复盘</tspan><tspan fill="#7d7a71"> · </tspan>
      <tspan>观</tspan><tspan fill="#7d7a71"> · </tspan>
      <tspan>此刻</tspan>
    </text>

    <!-- 分隔细线 -->
    <line x1="0" y1="312" x2="660" y2="312" stroke="#7d7a71" stroke-width="1" opacity="0.5"/>

    <!-- 元信息 -->
    <text class="sans gray" x="0" y="340" font-size="14" letter-spacing="0.34em">MODERN ORIENTAL MINIMALISM</text>
  </g>

  <!-- 右：圆环视觉（项目的核心几何语言） -->
  <g transform="translate(1010 150)">
    <circle cx="0" cy="0" r="88" fill="none" stroke="#e9e6de" stroke-width="1.5" opacity="0.85"/>
    <circle cx="0" cy="0" r="5" fill="#c8503a"/>
    <!-- 呼应小圆环 -->
    <circle cx="0" cy="-118" r="14" fill="none" stroke="#7d7a71" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="-118" r="2" fill="#7d7a71" opacity="0.8"/>
  </g>
</svg>
